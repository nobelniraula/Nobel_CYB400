<!--
  Snippet to add inside the <ossec_config> block of the Wazuh agent
  on Windows 10 (usually C:\Program Files (x86)\ossec-agent\ossec.conf).

  After editing, restart the agent:
    Restart-Service WazuhSvc
-->

  <!-- Sysmon operational channel -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Optional: Windows Defender logs if you keep Defender enabled -->
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Optional: real-time FIM on sample directories -->
  <syscheck>
    <disabled>no</disabled>
    <directories realtime="yes" check_all="yes">C:\Samples</directories>
    <directories realtime="yes" check_all="yes">C:\Users\*\Downloads</directories>
    <directories realtime="yes" check_all="yes">C:\Users\*\Desktop</directories>
  </syscheck>